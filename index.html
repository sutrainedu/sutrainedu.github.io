<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">tyle
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sut Raine Du | Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.6;
            color: #222;
            background: #f8f8f6;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(248,248,246,0.95);
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            border-bottom: 1px solid #ddd;
        }

        nav .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 25px;
        }

        nav a {
            text-decoration: none;
            color: #222;
            font-size: 14px;
        }

        nav a:hover {
            opacity: 0.5;
        }

        section {
            padding: 100px 8%;
        }

        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: #f8f8f6;
        }

        .hero-content {
            max-width: 900px;
        }

        .hero small {
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #777;
        }

        .hero h1 {
            font-size: clamp(55px, 10vw, 110px);
            line-height: 0.95;
            margin: 20px 0;
            letter-spacing: -5px;
        }

        .hero p {
            max-width: 650px;
            font-size: 20px;
            color: #555;
        }

        .buttons {
            margin-top: 35px;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            margin-right: 10px;
            border: 1px solid #222;
            text-decoration: none;
            color: #222;
            transition: 0.3s;
        }

        .btn:hover {
            background: #222;
            color: white;
        }

        .section-title {
            font-size: 42px;
            margin-bottom: 35px;
        }

        .about {
            background: white;
        }

        .about p {
            max-width: 800px;
            font-size: 19px;
            color: #555;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border: 1px solid #ddd;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card span {
            font-size: 13px;
            color: #777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .timeline {
            border-left: 2px solid #222;
            padding-left: 30px;
            max-width: 800px;
        }

        .timeline-item {
            margin-bottom: 35px;
        }

        .timeline-item h3 {
            margin-bottom: 5px;
        }

        .timeline-item p {
            color: #666;
        }

        .contact {
            background: #222;
            color: white;
        }

        .contact p {
            color: #ccc;
            max-width: 650px;
        }

        .contact a {
            color: white;
        }

        footer {
            background: #222;
            color: #888;
            text-align: center;
            padding: 25px;
            border-top: 1px solid #444;
        }

        @media (max-width: 700px) {

            nav ul {
                display: none;
            }

            section {
                padding: 80px 6%;
            }

            .hero h1 {
                font-size: 55px;
                letter-spacing: -3px;
            }

            .hero p {
                font-size: 17px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .section-title {
                font-size: 34px;
            }
        }
    .profile-photo {     width: 360px;     height: 460px;     object-fit: cover;     border-radius: 6px;     display: block; }
</head>
